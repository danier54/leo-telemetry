apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: leo-telemetry
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeIntervalSeconds }}s
      evaluation_interval: {{ .Values.scrapeIntervalSeconds }}s

    scrape_configs:
      - job_name: leo-telemetry-observability
        static_configs:
          - targets: ["observability-metrics:8000"]

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
