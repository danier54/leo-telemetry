apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: leo-telemetry
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  REDIS_URL: "redis://ingest-redis:6379/0"
  OBS_POLL_INTERVAL_SECONDS: {{ .Values.config.obsPollIntervalSeconds | quote }}
  METRICS_PORT: {{ .Values.config.metricsPort | quote }}
  TLE_REFRESH_SECONDS: {{ .Values.config.tleRefreshSeconds | quote }}
  POSITION_UPDATE_SECONDS: {{ .Values.config.positionUpdateSeconds | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
