apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: leo-telemetry
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      # Fixed NodePort so the host's Tailscale Funnel proxy target is stable
      nodePort: 30300
