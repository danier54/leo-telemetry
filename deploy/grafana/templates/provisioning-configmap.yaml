apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: leo-telemetry
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: leo-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: leo-telemetry
        folder: LEO Telemetry
        type: file
        disableDeletion: true
        options:
          path: /etc/grafana/dashboards
