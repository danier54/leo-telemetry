apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: leo-telemetry
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: leo-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Raw Frame Archive
        uid: leo-postgres
        type: postgres
        access: proxy
        url: ingest-postgres:5432
        user: decode_readonly
        editable: false
        jsonData:
          database: leo_telemetry
          sslmode: disable
          postgresVersion: 1600
        secureJsonData:
          password: $POSTGRES_READONLY_PASSWORD
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: leo-telemetry
        folder: LEO Telemetry
        type: file
        disableDeletion: true
        options:
          path: /etc/grafana/dashboards
