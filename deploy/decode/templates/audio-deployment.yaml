apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-decode
  namespace: leo-telemetry
  labels:
    {{- include "decode.labels" . | nindent 4 }}
    app: audio-decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-decode
  template:
    metadata:
      labels:
        app: audio-decode
    spec:
      containers:
        - name: audio-decode
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "leo_telemetry.decode.audio_run"]
          envFrom:
            - configMapRef:
                name: decode-config
          resources:
            {{- toYaml .Values.audioResources | nindent 12 }}
